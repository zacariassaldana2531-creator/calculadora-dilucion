<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Calculadora de Dilución y Concentración</title>
<meta name="description" content="Calcula mililitros de concentrado y base, escala lotes y estima costos de producción por unidad.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&%23129514;</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { background: #0B0A08; }
  body { -webkit-font-smoothing: antialiased; }
  input, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;

/* ---------- Paleta ---------- */
const C = {
  fondo: "#0B0A08",
  panel: "#14120E",
  panelAlto: "#1B1813",
  borde: "#2C2720",
  bordeSuave: "#221E18",
  oro: "#C9A227",
  oroClaro: "#E8C87A",
  texto: "#EDE7DA",
  tenue: "#8B8375",
  base: "#3A3529",
};

/* ---------- Iconos ---------- */
const Svg = ({ size = 16, children, ...p }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"
       strokeLinejoin="round" {...p}>{children}</svg>
);
const IconDownload = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Svg>;
const IconCopy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const IconCheck = (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const IconDrop = (p) => <Svg {...p}><path d="M12 2.7 7.4 8.4a6 6 0 1 0 9.2 0Z"/></Svg>;
const IconBox = (p) => <Svg {...p}><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></Svg>;
const IconFlask = (p) => <Svg {...p}><path d="M10 2v6.5L4.5 18A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 8.5V2"/><line x1="9" y1="2" x2="15" y2="2"/><line x1="7" y1="15" x2="17" y2="15"/></Svg>;

/* ---------- Utilidades ---------- */
const num = (v) => {
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) && n > 0 ? n : 0;
};
const fmt = (n, d = 2) =>
  (isFinite(n) ? n : 0).toLocaleString("es-DO", { minimumFractionDigits: d, maximumFractionDigits: d });

const PRESETS = [
  { nombre: "Eau Fraîche", pct: 4 },
  { nombre: "Eau de Cologne", pct: 7 },
  { nombre: "Eau de Toilette", pct: 12 },
  { nombre: "Eau de Parfum", pct: 20 },
  { nombre: "Extrait", pct: 30 },
];
const LOTES = [
  { n: 1, etiqueta: "Unidad" },
  { n: 12, etiqueta: "Lote 12" },
  { n: 50, etiqueta: "Lote 50" },
];

/* ---------- Piezas ---------- */
function Etiqueta({ children }) {
  return <span className="block text-xs uppercase tracking-widest mb-2" style={{ color: C.tenue }}>{children}</span>;
}

function Campo({ valor, onChange, sufijo, ancho = "w-full" }) {
  return (
    <div className="relative">
      <input
        type="text" inputMode="decimal" value={valor}
        onChange={(e) => onChange(e.target.value)}
        className={`${ancho} rounded-md px-3 py-3 pr-14 text-lg outline-none`}
        style={{ background: C.panelAlto, border: `1px solid ${C.borde}`, color: C.texto, fontVariantNumeric: "tabular-nums" }}
        onFocus={(e) => (e.target.style.borderColor = C.oro)}
        onBlur={(e) => (e.target.style.borderColor = C.borde)}
      />
      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm" style={{ color: C.tenue }}>{sufijo}</span>
    </div>
  );
}

function Panel({ children, className = "" }) {
  return (
    <section className={`rounded-lg p-5 ${className}`} style={{ background: C.panel, border: `1px solid ${C.bordeSuave}` }}>
      {children}
    </section>
  );
}

function Probeta({ pct, total }) {
  const marcas = [100, 75, 50, 25];
  return (
    <div className="flex items-stretch gap-4">
      <div className="relative w-24 shrink-0 overflow-hidden"
           style={{ height: 280, background: C.panelAlto, border: `1px solid ${C.borde}`, borderRadius: "6px 6px 18px 18px" }}>
        <div className="absolute inset-x-0 bottom-0 transition-all duration-500" style={{ height: "100%", background: C.base, opacity: 0.55 }} />
        <div className="absolute inset-x-0 bottom-0 transition-all duration-500"
             style={{ height: `${Math.min(pct, 100)}%`, background: `linear-gradient(180deg, ${C.oroClaro} 0%, ${C.oro} 45%, #8A6E14 100%)` }} />
        <div className="absolute inset-x-0 transition-all duration-500"
             style={{ bottom: `${Math.min(pct, 100)}%`, height: 1, background: C.oroClaro }} />
        {marcas.map((m) => (
          <div key={m} className="absolute left-0"
               style={{ bottom: `${m}%`, width: m % 50 === 0 ? 20 : 12, height: 1, background: "rgba(237,231,218,0.35)" }} />
        ))}
      </div>
      <div className="flex flex-col justify-between py-1">
        {marcas.map((m) => (
          <div key={m} className="text-xs" style={{ color: C.tenue, fontVariantNumeric: "tabular-nums" }}>
            {fmt((total * m) / 100, 0)} ml
          </div>
        ))}
        <div className="text-xs" style={{ color: C.tenue }}>0 ml</div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [nombre, setNombre] = useState("Fórmula sin nombre");
  const [codigo, setCodigo] = useState("E-000");
  const [modo, setModo] = useState("lote");
  const [frasco, setFrasco] = useState("100");
  const [unidades, setUnidades] = useState(12);
  const [unidadesLibres, setUnidadesLibres] = useState("12");
  const [totalManual, setTotalManual] = useState("500");
  const [concentracion, setConcentracion] = useState("20");
  const [merma, setMerma] = useState("0");
  const [multiplicador, setMultiplicador] = useState("3");
  const [costos, setCostos] = useState({ esencia: "38", base: "4", frasco: "85", valvula: "25", empaque: "40" });
  const [copiado, setCopiado] = useState(false);
  const areaRef = useRef(null);

  const setCosto = (k) => (v) => setCostos((c) => ({ ...c, [k]: v }));

  const d = useMemo(() => {
    const frascoMl = num(frasco);
    const uds = modo === "lote" ? Math.max(1, Math.round(num(unidades) || 1)) : 0;
    const pct = Math.min(num(concentracion), 100);
    const volumenNeto = modo === "lote" ? frascoMl * uds : num(totalManual);
    const volumenTrabajo = volumenNeto * (1 + num(merma) / 100);
    const mlEsencia = (volumenTrabajo * pct) / 100;
    const mlBase = volumenTrabajo - mlEsencia;
    const udsCosteadas = modo === "lote" ? uds : frascoMl > 0 ? Math.floor(volumenNeto / frascoMl) : 0;
    const sobrante = frascoMl > 0 ? volumenNeto - udsCosteadas * frascoMl : 0;

    const filas = [
      { n: "Concentrado / esencia", detalle: `${fmt(mlEsencia)} ml`, unitario: `${fmt(num(costos.esencia))} / ml`, sub: mlEsencia * num(costos.esencia) },
      { n: "Base / diluyente", detalle: `${fmt(mlBase)} ml`, unitario: `${fmt(num(costos.base))} / ml`, sub: mlBase * num(costos.base) },
      { n: "Frasco vacío", detalle: `${udsCosteadas} u`, unitario: `${fmt(num(costos.frasco))} / u`, sub: udsCosteadas * num(costos.frasco) },
      { n: "Válvula / atomizador", detalle: `${udsCosteadas} u`, unitario: `${fmt(num(costos.valvula))} / u`, sub: udsCosteadas * num(costos.valvula) },
      { n: "Etiqueta y empaque", detalle: `${udsCosteadas} u`, unitario: `${fmt(num(costos.empaque))} / u`, sub: udsCosteadas * num(costos.empaque) },
    ];
    const total = filas.reduce((a, f) => a + f.sub, 0);
    const porUnidad = udsCosteadas > 0 ? total / udsCosteadas : 0;
    const precio = porUnidad * (num(multiplicador) || 0);
    const margen = precio > 0 ? ((precio - porUnidad) / precio) * 100 : 0;

    return { frascoMl, pct, volumenNeto, volumenTrabajo, mlEsencia, mlBase, udsCosteadas, sobrante, filas, total, porUnidad, precio, margen };
  }, [frasco, unidades, totalManual, concentracion, merma, modo, costos, multiplicador]);

  const ficha = useMemo(() => {
    const L = [];
    const linea = (a, b) => `${String(a).padEnd(26, " ")}${b}`;
    L.push("FICHA DE FÓRMULA");
    L.push("=".repeat(52));
    L.push(linea("Fórmula:", nombre));
    L.push(linea("Código:", codigo));
    L.push(linea("Fecha:", new Date().toLocaleDateString("es-DO")));
    L.push("");
    L.push("PARÁMETROS");
    L.push("-".repeat(52));
    L.push(linea("Concentración objetivo:", `${fmt(d.pct, 1)} %`));
    L.push(linea("Volumen por frasco:", `${fmt(d.frascoMl, 0)} ml`));
    L.push(linea("Escala del lote:", `${d.udsCosteadas} unidad(es)`));
    L.push(linea("Volumen neto:", `${fmt(d.volumenNeto)} ml`));
    if (num(merma) > 0) {
      L.push(linea("Merma prevista:", `${fmt(num(merma), 1)} %`));
      L.push(linea("Volumen a preparar:", `${fmt(d.volumenTrabajo)} ml`));
    }
    L.push("");
    L.push("FÓRMULA");
    L.push("-".repeat(52));
    L.push(linea("Concentrado / esencia:", `${fmt(d.mlEsencia)} ml`));
    L.push(linea("Base / diluyente:", `${fmt(d.mlBase)} ml`));
    L.push(linea("Total mezcla:", `${fmt(d.volumenTrabajo)} ml`));
    L.push("");
    L.push("COSTOS (RD$)");
    L.push("-".repeat(52));
    d.filas.forEach((f) => L.push(`${f.n.padEnd(24, " ")}${f.detalle.padStart(12, " ")}${fmt(f.sub).padStart(14, " ")}`));
    L.push("-".repeat(52));
    L.push(linea("Costo total del lote:", `RD$ ${fmt(d.total)}`));
    L.push(linea("Costo por unidad:", `RD$ ${fmt(d.porUnidad)}`));
    L.push(linea(`Precio sugerido (x${num(multiplicador) || 0}):`, `RD$ ${fmt(d.precio)}`));
    L.push(linea("Margen bruto:", `${fmt(d.margen, 1)} %`));
    L.push("");
    L.push("Preparación: verter el concentrado primero, completar con la base,");
    L.push("agitar suavemente y macerar en oscuridad antes de envasar.");
    return L.join("\n");
  }, [nombre, codigo, d, merma, multiplicador]);

  const descargar = () => {
    const blob = new Blob([ficha], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ficha-formula-${codigo.replace(/\s+/g, "-").toLowerCase()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  const copiar = async () => {
    try {
      await navigator.clipboard.writeText(ficha);
    } catch (e) {
      if (areaRef.current) { areaRef.current.select(); document.execCommand("copy"); }
    }
    setCopiado(true);
    setTimeout(() => setCopiado(false), 2000);
  };

  const chip = (activo) => ({
    background: activo ? C.oro : C.panelAlto,
    border: `1px solid ${activo ? C.oro : C.borde}`,
    color: activo ? "#0B0A08" : C.texto,
  });

  return (
    <div className="min-h-screen w-full px-4 py-8 sm:px-8" style={{ background: C.fondo, color: C.texto }}>
      <div className="mx-auto max-w-5xl">
        <header className="mb-8 flex items-end justify-between gap-4 border-b pb-5" style={{ borderColor: C.bordeSuave }}>
          <div>
            <span className="text-xs uppercase tracking-widest" style={{ color: C.oro }}>Banco de trabajo</span>
            <h1 className="mt-1 font-serif text-3xl sm:text-4xl">Dilución y concentración</h1>
          </div>
          <span className="hidden sm:block" style={{ color: C.oro }}><IconFlask size={30} /></span>
        </header>

        <div className="grid gap-6 lg:grid-cols-5">
          <div className="space-y-6 lg:col-span-3">
            <Panel>
              <div className="grid gap-4 sm:grid-cols-2">
                <div><Etiqueta>Nombre de la fórmula</Etiqueta><Campo valor={nombre} onChange={setNombre} sufijo="" /></div>
                <div><Etiqueta>Código interno</Etiqueta><Campo valor={codigo} onChange={setCodigo} sufijo="" /></div>
              </div>
            </Panel>

            <Panel>
              <Etiqueta>Concentración objetivo</Etiqueta>
              <Campo valor={concentracion} onChange={setConcentracion} sufijo="%" />
              <div className="mt-3 flex flex-wrap gap-2">
                {PRESETS.map((p) => (
                  <button key={p.nombre} onClick={() => setConcentracion(String(p.pct))}
                          className="rounded-full px-3 py-1.5 text-xs" style={chip(num(concentracion) === p.pct)}>
                    {p.nombre} · {p.pct}%
                  </button>
                ))}
              </div>
            </Panel>

            <Panel>
              <div className="mb-4 flex gap-2">
                <button onClick={() => setModo("lote")} className="flex-1 rounded-md px-3 py-2 text-sm" style={chip(modo === "lote")}>Calcular por lote</button>
                <button onClick={() => setModo("total")} className="flex-1 rounded-md px-3 py-2 text-sm" style={chip(modo === "total")}>Calcular por volumen</button>
              </div>

              <div className="grid gap-4 sm:grid-cols-2">
                <div><Etiqueta>Volumen del frasco</Etiqueta><Campo valor={frasco} onChange={setFrasco} sufijo="ml" /></div>
                {modo === "lote" ? (
                  <div>
                    <Etiqueta>Unidades del lote</Etiqueta>
                    <Campo valor={unidadesLibres} onChange={(v) => { setUnidadesLibres(v); setUnidades(num(v) || 1); }} sufijo="u" />
                  </div>
                ) : (
                  <div><Etiqueta>Volumen total deseado</Etiqueta><Campo valor={totalManual} onChange={setTotalManual} sufijo="ml" /></div>
                )}
              </div>

              {modo === "lote" && (
                <div className="mt-3 flex flex-wrap gap-2">
                  {LOTES.map((l) => (
                    <button key={l.n} onClick={() => { setUnidades(l.n); setUnidadesLibres(String(l.n)); }}
                            className="rounded-full px-3 py-1.5 text-xs" style={chip(num(unidadesLibres) === l.n)}>
                      {l.etiqueta}
                    </button>
                  ))}
                </div>
              )}

              <div className="mt-4 border-t pt-4" style={{ borderColor: C.bordeSuave }}>
                <Etiqueta>Merma prevista (opcional)</Etiqueta>
                <Campo valor={merma} onChange={setMerma} sufijo="%" />
              </div>
            </Panel>
          </div>

          <div className="space-y-6 lg:col-span-2">
            <Panel>
              <Etiqueta>Mezcla</Etiqueta>
              <div className="flex items-center justify-between gap-4">
                <Probeta pct={d.pct} total={d.volumenTrabajo} />
                <div className="flex-1 space-y-5 text-right">
                  <div>
                    <span className="flex items-center justify-end gap-1.5 text-xs uppercase tracking-widest" style={{ color: C.tenue }}>
                      <IconDrop size={13} /> Concentrado
                    </span>
                    <p className="font-serif text-3xl" style={{ color: C.oroClaro, fontVariantNumeric: "tabular-nums" }}>
                      {fmt(d.mlEsencia)}<span className="ml-1 text-sm" style={{ color: C.tenue }}>ml</span>
                    </p>
                  </div>
                  <div>
                    <span className="block text-xs uppercase tracking-widest" style={{ color: C.tenue }}>Base / diluyente</span>
                    <p className="font-serif text-3xl" style={{ fontVariantNumeric: "tabular-nums" }}>
                      {fmt(d.mlBase)}<span className="ml-1 text-sm" style={{ color: C.tenue }}>ml</span>
                    </p>
                  </div>
                  <div className="border-t pt-3" style={{ borderColor: C.bordeSuave }}>
                    <span className="block text-xs uppercase tracking-widest" style={{ color: C.tenue }}>Mezcla total</span>
                    <p className="text-lg" style={{ fontVariantNumeric: "tabular-nums" }}>{fmt(d.volumenTrabajo)} ml</p>
                  </div>
                </div>
              </div>
              <p className="mt-4 flex items-center gap-2 text-xs" style={{ color: C.tenue }}>
                <IconBox size={13} />
                Llena {d.udsCosteadas} frasco(s) de {fmt(d.frascoMl, 0)} ml
                {d.sobrante > 0.01 ? ` · sobran ${fmt(d.sobrante)} ml` : ""}
              </p>
            </Panel>

            <Panel>
              <Etiqueta>Costo por insumo (RD$)</Etiqueta>
              <div className="grid grid-cols-2 gap-3">
                {[["esencia", "Esencia / ml"], ["base", "Base / ml"], ["frasco", "Frasco / u"], ["valvula", "Válvula / u"], ["empaque", "Empaque / u"], ["multiplicador", "Multiplicador"]].map(([k, label]) =>
                  k === "multiplicador" ? (
                    <div key={k}>
                      <span className="mb-1 block text-xs" style={{ color: C.tenue }}>{label}</span>
                      <Campo valor={multiplicador} onChange={setMultiplicador} sufijo="x" />
                    </div>
                  ) : (
                    <div key={k}>
                      <span className="mb-1 block text-xs" style={{ color: C.tenue }}>{label}</span>
                      <Campo valor={costos[k]} onChange={setCosto(k)} sufijo="" />
                    </div>
                  )
                )}
              </div>
            </Panel>
          </div>
        </div>

        <Panel className="mt-6">
          <Etiqueta>Costos del lote</Etiqueta>
          <div className="-mx-2 overflow-x-auto">
            <table className="w-full text-sm" style={{ minWidth: 420, fontVariantNumeric: "tabular-nums" }}>
              <thead>
                <tr style={{ color: C.tenue }} className="text-xs uppercase tracking-widest">
                  <th className="px-2 py-2 text-left font-normal">Insumo</th>
                  <th className="px-2 py-2 text-right font-normal">Cantidad</th>
                  <th className="px-2 py-2 text-right font-normal">Unitario</th>
                  <th className="px-2 py-2 text-right font-normal">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                {d.filas.map((f) => (
                  <tr key={f.n} className="border-t" style={{ borderColor: C.bordeSuave }}>
                    <td className="px-2 py-3">{f.n}</td>
                    <td className="px-2 py-3 text-right" style={{ color: C.tenue }}>{f.detalle}</td>
                    <td className="px-2 py-3 text-right" style={{ color: C.tenue }}>{f.unitario}</td>
                    <td className="px-2 py-3 text-right">{fmt(f.sub)}</td>
                  </tr>
                ))}
                <tr className="border-t-2" style={{ borderColor: C.borde }}>
                  <td className="px-2 py-3 text-xs uppercase tracking-widest" style={{ color: C.tenue }} colSpan={3}>Costo total del lote</td>
                  <td className="px-2 py-3 text-right font-serif text-xl" style={{ color: C.oroClaro }}>{fmt(d.total)}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="mt-5 grid gap-4 border-t pt-5 sm:grid-cols-3" style={{ borderColor: C.bordeSuave }}>
            {[["Costo por unidad", `RD$ ${fmt(d.porUnidad)}`, C.texto],
              ["Precio sugerido", `RD$ ${fmt(d.precio)}`, C.oroClaro],
              ["Margen bruto", `${fmt(d.margen, 1)} %`, C.texto]].map(([l, v, color]) => (
              <div key={l}>
                <span className="block text-xs uppercase tracking-widest" style={{ color: C.tenue }}>{l}</span>
                <p className="font-serif text-2xl" style={{ color, fontVariantNumeric: "tabular-nums" }}>{v}</p>
              </div>
            ))}
          </div>
        </Panel>

        <Panel className="mt-6">
          <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
            <Etiqueta>Ficha de fórmula</Etiqueta>
            <div className="flex gap-2">
              <button onClick={copiar} className="flex items-center gap-2 rounded-md px-4 py-2 text-sm"
                      style={{ background: C.panelAlto, border: `1px solid ${C.borde}`, color: C.texto }}>
                {copiado ? <IconCheck size={15} /> : <IconCopy size={15} />}
                {copiado ? "Copiada" : "Copiar"}
              </button>
              <button onClick={descargar} className="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium"
                      style={{ background: C.oro, color: "#0B0A08" }}>
                <IconDownload size={15} /> Descargar .txt
              </button>
            </div>
          </div>
          <pre className="overflow-x-auto rounded-md p-4 text-xs leading-relaxed"
               style={{ background: C.panelAlto, border: `1px solid ${C.bordeSuave}`, color: C.tenue }}>{ficha}</pre>
          <textarea ref={areaRef} value={ficha} readOnly tabIndex={-1}
                    style={{ position: "absolute", left: -9999, opacity: 0, height: 1, width: 1 }} />
        </Panel>

        <p className="mt-6 text-center text-xs" style={{ color: C.tenue }}>
          Los valores se recalculan al escribir. Ajusta los costos a tus precios reales de compra.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
